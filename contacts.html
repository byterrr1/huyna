<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>Контакты и форма</title>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="nadpis">Айти колледж</a>
            <nav>
                <a href="index.html" class="navigazia">Главная</a>
                <a href="about.html" class="navigazia">О колледже</a>
                <a href="courses.html" class="navigazia">Курсы</a>
                <a href="contacts.html" class="navigazia active">Контакты и форма</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="sektia">
            <div class="container">
                <h1 class="zaglav">Контакты</h1>
                <div class="contact-info">
                    <p class="tekst-contacts"><strong>Адрес:</strong> г. Москва, ул. Золочевского, д. 69</p>
                    <p class="tekst-contacts"><strong>Телефон:</strong> +7 (***) ***-**-**</p>
                    <p class="tekst-contacts"><strong>Email:</strong> college@gmail.ru</p>
                </div>
                <h2 class="zaglav2">Оставить заявку</h2>
                <form id="contact-form" class="contact-form">
                    <div class="form-group">
                        <label for="name">Имя <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="Ваше имя">
                    </div>
                    <div class="form-group">
                        <label for="phone">Телефон <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__">
                    </div>
                    <div class="form-group">
                        <label for="email">Почта <span class="required">*</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.ru">
                    </div>
                    <div class="form-group">
                        <label for="course">Выбор курса</label>
                        <select id="course" name="course">
                            <option value="frontend">Frontend-разработка</option>
                            <option value="backend">Backend-разработка</option>
                            <option value="design">UI/UX Дизайн</option>
                            <option value="cybersec">Кибербезопасность</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" name="message" rows="4" placeholder="Ваше сообщение..."></textarea>
                    </div>
                    <button type="submit" class="btn">Отправить</button>
                    <div id="form-message" class="form-message"></div>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="container footer-inner">
            <div class="footer-text">© 2026 Колледж</div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
